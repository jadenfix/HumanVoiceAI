name: CPU SER computation
on: [push, pull_request]
jobs:
  ser:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest numpy pyyaml 'pydantic>=2,<3' soundfile transformers scipy
      - run: python -m pytest -q
      - run: python -m human_voice_ai.ser_smoke --policy-config configs/rl_policy_config.yaml --output artifacts/ser-smoke
      - uses: actions/upload-artifact@v4
        with: {name: ser-computation-receipt, path: artifacts/ser-smoke/receipt.json}
